<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Lost in Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&family=Ubuntu+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        /* ── Dark sky ── */
        .main-div {
            --bg: #02040A;
            --text-primary: #E6F1FF;
            --text-secondary: #8892B0;
            --accent: #64FFDA;
            --accent-hover: #4CD1B0;
            --accent-glow: rgba(100, 255, 218, 0.25);
            --font-sans: 'Ubuntu', sans-serif;
            --font-serif: 'Fraunces', Georgia, serif;
            --font-mono: 'Ubuntu Mono', 'DejaVu Sans Mono', monospace;

            font-family: var(--font-sans);
            background: radial-gradient(ellipse 120% 70% at 50% 115%, #0B1B33 0%, #050A14 55%, #02040A 100%);
            color: var(--text-primary);
            line-height: 1.6;
            overflow: hidden;
            min-height: calc(100vh - 62px);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .starfield {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.15;
            }

            50% {
                opacity: 0.85;
            }
        }

        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.08;
            z-index: 0;
            pointer-events: none;
        }

        .nebula-1 {
            width: 560px;
            height: 560px;
            background: radial-gradient(circle, #64FFDA 0%, transparent 70%);
            top: -220px;
            left: -200px;
            animation: drift-1 30s ease-in-out infinite alternate;
        }

        .nebula-2 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, #4A90D9 0%, transparent 70%);
            bottom: -180px;
            right: -160px;
            animation: drift-2 36s ease-in-out infinite alternate;
        }

        @keyframes drift-1 {
            to {
                transform: translate(80px, 60px) scale(1.15);
            }
        }

        @keyframes drift-2 {
            to {
                transform: translate(-70px, -50px) scale(1.1);
            }
        }

        /* ── Meteors: one at a time, fixed angle, short and quick ── */
        .meteor {
            position: absolute;
            z-index: 1;
            height: 2px;
            width: var(--len);
            border-radius: 2px;
            opacity: 0;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.85));
            animation: meteor var(--dur) cubic-bezier(.3, .6, .4, 1) forwards;
        }

        .meteor::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            width: 4px;
            height: 4px;
            margin-top: -2px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.55);
        }

        @keyframes meteor {
            0% {
                opacity: 0;
                transform: rotate(var(--a)) translateX(0);
            }

            15% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: rotate(var(--a)) translateX(var(--dist));
            }
        }

        /* ── Astronaut ── */
        .astronaut-wrap {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            right: clamp(1.5rem, 9vw, 8rem);
            top: 50%;
            width: clamp(150px, 20vw, 290px);
            transform: translateY(-50%);
            transition: translate 0.9s ease-out;
        }

        .astronaut {
            display: block;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(100, 255, 218, 0.12));
            animation: float 22s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) rotate(-4deg);
            }

            25% {
                transform: translate(26px, -22px) rotate(3deg);
            }

            50% {
                transform: translate(8px, 22px) rotate(6deg);
            }

            75% {
                transform: translate(-24px, 6px) rotate(-1deg);
            }
        }

        /* ── Content ── */
        .not-found-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            max-width: 700px;
        }

        .not-found-code {
            font-family: var(--font-serif);
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 600;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 40px var(--accent-glow);
            animation: pulse-glow 4s ease-in-out infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                text-shadow: 0 0 40px var(--accent-glow);
            }

            50% {
                text-shadow: 0 0 70px var(--accent-glow);
            }
        }

        .not-found-title {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 500;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        .not-found-path {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--accent);
            opacity: 0.8;
            margin-bottom: 1rem;
            overflow-wrap: anywhere;
        }

        .not-found-message {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            max-width: 500px;
            line-height: 1.7;
        }

        .not-found-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.75rem;
            border-radius: 8px;
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #0A192F;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn svg {
            width: 36px;
            height: 36px;
        }

        @media (max-width: 900px) {
            .astronaut-wrap {
                right: 1rem;
                top: 1rem;
                width: 110px;
                transform: none;
            }
        }

        @media (max-width: 600px) {
            .not-found-container {
                padding: 1.5rem;
                padding-top: 5rem;
            }

            .not-found-actions {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .star,
            .nebula,
            .astronaut,
            .not-found-code {
                animation: none;
            }

            .star {
                opacity: 0.6;
            }
        }
    </style>
</head>

<body>

    <div class="main-div">
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="starfield" id="starfield"></div>
        <div id="meteor-field"></div>

        <!-- Astronaut: replace src with your image. A placeholder shows if the file isn't found. -->
        <div class="astronaut-wrap" id="astronaut-wrap" aria-hidden="true">
            <img class="astronaut" id="astronaut" src="/images/astronaut.png" alt="">
        </div>

        <div class="not-found-container">
            <h1 class="not-found-code">404</h1>
            <h2 class="not-found-title">Lost in Space</h2>
            <p class="not-found-path" id="not-found-path"></p>
            <p class="not-found-message">
                Looks like this page drifted off into the cosmos.
                The coordinates you entered don't match any known destination in this galaxy.
            </p>
            <div class="not-found-actions">
                <a href="/" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Return to Home Planet
                </a>
            </div>
        </div>
    </div>

    <script>
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Starfield
        const starfield = document.getElementById('starfield');
        for (let i = 0; i < 170; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 0.5;
            star.style.cssText = `width:${size}px;height:${size}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;` +
                `animation-delay:${Math.random() * 3}s;animation-duration:${Math.random() * 3 + 2.5}s`;
            starfield.appendChild(star);
        }

        // Meteors: one at a time, all travelling the same direction, short and quick
        const meteorField = document.getElementById('meteor-field');
        function launchMeteor() {
            if (!document.hidden) {
                const m = document.createElement('div');
                m.className = 'meteor';
                m.style.left = `${5 + Math.random() * 60}%`;
                m.style.top = `${3 + Math.random() * 30}%`;
                m.style.setProperty('--a', `${25 + Math.random() * 15}deg`);
                m.style.setProperty('--len', `${90 + Math.random() * 60}px`);
                m.style.setProperty('--dist', `${300 + Math.random() * 300}px`);
                m.style.setProperty('--dur', `${1.1 + Math.random() * 0.6}s`);
                m.addEventListener('animationend', () => m.remove());
                meteorField.appendChild(m);
            }
            setTimeout(launchMeteor, 5000 + Math.random() * 7000);
        }
        if (!reduceMotion) setTimeout(launchMeteor, 2500);

        if (!reduceMotion && matchMedia('(hover: hover)').matches) {
            const wrap = document.getElementById('astronaut-wrap');
            addEventListener('pointermove', (e) => {
                wrap.style.translate = `${(e.clientX / innerWidth - 0.5) * -24}px ${(e.clientY / innerHeight - 0.5) * -24}px`;
            });
        }

        // Press Enter to return home
        document.addEventListener('keydown', (e) => { if (e.key === 'Enter') window.location.href = '/'; });
    </script>
    <script src="/script.js"></script>

</body>

</html>
