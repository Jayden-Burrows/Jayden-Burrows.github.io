<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayden Burrows</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        main {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--drawer-profile);
            color: white;
            height: calc(100vh - 56px);
            text-align: center;
            overflow: hidden;
            margin: 8px;
        }

        main #bg {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        main #bg #neptune {
            width: 35%;
            aspect-ratio: 1 / 1;
            position: absolute;
            /* Kept absolute, removed duplicate relative */
            top: 5%;
            left: -15%;
            border-radius: 50%;
            overflow: hidden;
            box-shadow:
                inset -12px -12px 20px rgba(0, 0, 0, 0.85),
                inset 4px 4px 10px rgba(255, 255, 255, 0.25),
                0 0 15px rgba(232, 211, 186, 0.2);
        }

        main #bg #neptune .surface {
            position: absolute;
            inset: -25%;
            background-image: linear-gradient(135deg,
                    #494eb0 0%,
                    #7c81e8 15%,
                    #333766 25%,
                    #3d42a2 35%,
                    #5f64cd 50%,
                    #393b62 65%,
                    #8084d0 80%,
                    #404491 100%);
            background-size: 100% 100%;
            animation: revolve 6s linear infinite;
        }

        main #bg #venus {
            width: 15%;
            aspect-ratio: 1 / 1;
            position: absolute;
            /* Kept absolute, removed duplicate relative */
            bottom: 5%;
            /* Anchored to bottom right of #bg */
            right: 5%;
            border-radius: 50%;
            overflow: hidden;
            box-shadow:
                inset -12px -12px 20px rgba(0, 0, 0, 0.85),
                inset 4px 4px 10px rgba(255, 255, 255, 0.25),
                0 0 15px rgba(232, 211, 186, 0.2);
        }

        main #bg #venus .surface {
            position: absolute;
            inset: -25%;
            background-image: linear-gradient(135deg,
                    #b04e49 0%,
                    #673734 15%,
                    #eb8681 25%,
                    #b04e49 35%,
                    #c2423c 50%,
                    #923632 65%,
                    #e46e67 80%);
            background-size: 100% 100%;
            animation: revolve 6s linear infinite;
        }

        @keyframes revolve {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        main #main-msg {
            z-index: 1;
        }

        main #header-404 {
            margin: 0.1em;
            font-size: 180px;
            border-bottom: 4px solid var(--primary);
        }

        main #header-pnf {
            margin: 0 0 0.5em 0;
            font-size: 36px;
        }

        main #home-btn {
            text-decoration: none;
            padding: 12px;
            font-size: 18px;
            background-color: var(--primary);
            color: white;
            border-radius: 12px;
            border: none;
            transition: background-color 250ms ease;
        }

        main #home-btn:hover {
            background-color: var(--accent);
        }

        main #home-btn:active {
            background-color: var(--accent-dark);
        }

        @media (min-width: 650px) {
            main {
                height: calc(100vh - 64px);
            }
        }
    </style>
</head>

<body>

    <main>
        <section id="bg">
            <div id="neptune">
                <div class="surface"></div>
            </div>
            <div id="venus">
                <div class="surface"></div>
            </div>
        </section>
        <section id="main-msg">
            <h1 id="header-404">404</h1>
            <h2 id="header-pnf">Page Not Found</h2>
            <a id="home-btn" href="/">Return to Home Planet?</a>
        </section>
    </main>

    <script src="/script.js"></script>
</body>

</html>
