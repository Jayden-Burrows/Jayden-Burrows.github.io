<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Lost in Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Radley:ital@0;1&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        :root {
            --bg: #0A192F;
            --surface: #112240;
            --text-primary: #E6F1FF;
            --text-secondary: #8892B0;
            --accent: #64FFDA;
            --accent-hover: #4CD1B0;
            --accent-glow: rgba(100, 255, 218, 0.3);
            --font-sans: 'Ubuntu', sans-serif;
            --font-serif: 'Radley', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        .main-div {
            font-family: var(--font-sans);
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ── Starfield Background ── */
        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ── Nebula Clouds ── */
        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        .nebula-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #64FFDA 0%, transparent 70%);
            top: -200px;
            left: -200px;
            animation: drift-1 25s ease-in-out infinite alternate;
        }

        .nebula-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #4A90D9 0%, transparent 70%);
            bottom: -150px;
            right: -150px;
            animation: drift-2 30s ease-in-out infinite alternate;
        }

        .nebula-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #9D7CD8 0%, transparent 70%);
            top: 40%;
            right: 20%;
            animation: drift-3 35s ease-in-out infinite alternate;
        }

        @keyframes drift-1 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(80px, 60px) scale(1.15);
            }
        }

        @keyframes drift-2 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(-70px, -50px) scale(1.1);
            }
        }

        @keyframes drift-3 {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(-50px, 40px) scale(1.2);
            }
        }

        /* ── Shooting Stars ── */
        .shooting-star {
            position: fixed;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.6);
            z-index: 1;
            opacity: 0;
            animation: shoot linear infinite;
            will-change: transform, opacity;
        }

        .shooting-star::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 0;
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8));
            transform: translateY(-50%);
            transform-origin: right center;
        }

        @keyframes shoot {
            0% {
                transform: translate(0, 0) rotate(45deg);
                opacity: 0;
            }

            5% {
                opacity: 1;
            }

            30% {
                opacity: 1;
            }

            40% {
                transform: translate(60vw, 60vh) rotate(45deg);
                opacity: 0;
            }

            100% {
                transform: translate(60vw, 60vh) rotate(45deg);
                opacity: 0;
            }
        }

        /* ── Content ── */
        .not-found-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            max-width: 700px;
        }

        .not-found-code {
            font-family: var(--font-serif);
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 600;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 40px var(--accent-glow);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                text-shadow: 0 0 40px var(--accent-glow);
            }

            50% {
                text-shadow: 0 0 80px var(--accent-glow), 0 0 120px var(--accent-glow);
            }
        }

        .not-found-title {
            font-family: var(--font-sans);
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        .not-found-message {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            max-width: 500px;
            line-height: 1.7;
        }

        .not-found-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.75rem;
            border-radius: 8px;
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.25s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #0A192F;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-primary);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-3px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        #nav-title {
            color: var(--accent-hover);
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .not-found-container {
                padding: 1.5rem;
            }

            .not-found-actions {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }

            .nebula {
                filter: blur(60px);
            }
        }
    </style>
</head>

<body>

    <div class="main-div">
        <!-- Nebula Clouds -->
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="nebula nebula-3"></div>
        <!-- Starfield -->
        <div class="starfield" id="starfield"></div>
        <!-- Shooting Stars (populated by JS) -->
        <div id="shooting-star-field"></div>
        <!-- Content -->
        <div class="not-found-container">
            <h1 class="not-found-code">404</h1>
            <h2 class="not-found-title">Lost in Space</h2>
            <p class="not-found-message">
                Looks like this page drifted off into the cosmos.
                The coordinates you entered don't match any known destination in this galaxy.
            </p>
            <div class="not-found-actions">
                <a href="/" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Return to Home Planet
                </a>
            </div>
        </div>
    </div>

    <script>
        // ── Generate Starfield ──
        const starfield = document.getElementById('starfield');
        const starCount = 200;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');

            const size = Math.random() * 2.5 + 0.5;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animationDelay = `${Math.random() * 3}s`;
            star.style.animationDuration = `${Math.random() * 2 + 2}s`;

            starfield.appendChild(star);
        }

        // ── Generate Shooting Stars ──
        const shootingStarField = document.getElementById('shooting-star-field');

        function createShootingStar() {
            const star = document.createElement('div');
            star.classList.add('shooting-star');

            // Random starting position (top half of the screen)
            star.style.left = `${Math.random() * 80}%`;
            star.style.top = `${Math.random() * 40}%`;

            // Random animation duration (4-8 seconds)
            const duration = Math.random() * 4 + 4;
            star.style.animationDuration = `${duration}s`;

            // Random delay before it starts (0-20 seconds)
            star.style.animationDelay = `${Math.random() * 20}s`;

            shootingStarField.appendChild(star);
        }

        // Create several shooting stars
        for (let i = 0; i < 6; i++) {
            createShootingStar();
        }

        // ── Keyboard Shortcut: Press Enter to Return Home ──
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                window.location.href = '/';
            }
        });
    </script>
    <script src="/script.js"></script>

</body>

</html>
