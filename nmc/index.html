    <link href="../style.css" rel="stylesheet">
    <style>
        h1 {
            text-align: center;
            color: var(--accent);
        }

        #courses {
            width: 80vw;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            margin: 0 auto;
        }

        .course-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 80px;
            min-width: 80px;
            max-width: 250px;
            margin: 0;
            padding: 8px 8px;
            border: 1px solid var(--text);
            border-radius: 8px;
            box-shadow: 4px 4px 2px var(--bg-shadow);
            transition: transform 250ms ease, box-shadow 250ms ease;

            i {
                color: var(--text-secondary);
                font-size: 48px;
            }

            a {
                text-decoration: none;
                color: var(--primary);
                font-size: 16px;
                font-weight: 600;
                letter-spacing: 0.01em;
            }
        }

        .assignment-card:hover {
            transform: translateY(-3px);
            box-shadow: 8px 8px 2px var(--bg-shadow);
        }

    </style>
</head>
