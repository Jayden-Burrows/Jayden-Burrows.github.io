<!DOCTYPE html>
<html lang="">

<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.18.0/axios.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="css/style.css">
  <title>How Bout'Em</title>
</head>

<body>
  <div id="app">
    <div id="breed-btns">
      <button v-on:click="showme('cocker')" type="button">Cocker</button>
      <button v-on:click="showme('brittany')" type="button">Brittany</button>
    </div>
    <div v-if="moreData.length > 0">
      <h3>{{ whichDawg.toUpperCase() }} SPANIEL</h3>
      <!-- Images Grid -->
      <div id="images">
        <div v-for="image in shownImages">
          <img :src="image" alt="Shown spaniel image">
        </div>
      </div>

      <!-- Pagination -->
      <div id="pagination">
        <div v-if="currentIndex > 1">
          <div>
            <button v-on:click="currentIndex -= 1" type="button">&lt;</button>
          </div>
        </div>
        <div id="pages">
          <div v-for="page in pagination">
            <button v-on:click="currentIndex = page" type="button">{{ page }}</button>
          </div>
        </div>
        <div v-if="currentIndex < numPages">
          <div>
            <button v-on:click="currentIndex += 1" type="button">&gt;</button>
          </div>
        </div>
      </div>

    </div>
    <!-- <a :href="moreData[selector]" target="_blank">
        <img :src="moreData[selector]" alt="Current spaniel image">
      </a>
      <br> <button v-on:click="slider()">Next</button> -->
  </div>

  <script src="js/script.js"></script>
  <script src="/script.js"></script>
</body>

</html>
