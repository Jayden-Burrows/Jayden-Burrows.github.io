<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jayden Burrows">
    <title>Jayden Burrows</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link href="/style.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <main>
        <!--
            Build the HTML document:
            Create a button with an id of "addButton".
        -->
        <div id="output-elements">
            <input type="text" id="output" readonly>
        </div>
        <div id="selections">
            <button type="button" id="deleteButton">DEL</button>
            <button type="button" id="clearButton">CLEAR</button>
        </div>
        <div class="flex">
            <div id="inputs">
                <button data-value="7" type="button">7</button>
                <button data-value="8" type="button">8</button>
                <button data-value="9" type="button">9</button>
                <button data-value="4" type="button">4</button>
                <button data-value="5" type="button">5</button>
                <button data-value="6" type="button">6</button>
                <button data-value="1" type="button">1</button>
                <button data-value="2" type="button">2</button>
                <button data-value="3" type="button">3</button>

                <button data-value="0" type="button">0</button>
                <button data-value="." type="button">.</button>
                <button data-value="=" type="button" id="equalButton">=</button>

            </div>
            <div id="operations">
                <button data-value="/" type="button" id="divideButton">/</button>
                <button data-value="*" type="button" id="multiplyButton">x</button>
                <button data-value="-" type="button" id="subtractButton">-</button>
                <button data-value="+" type="button" id="addButton">+</button>
            </div>
        </div>
    </main>

    <script src="/script.js"></script>
    <script src="js/calculate.js"></script>

</body>

</html>
