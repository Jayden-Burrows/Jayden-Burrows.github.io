<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jayden Burrows">
    <title>Jayden Burrows</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link href="/style.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <main>
        <!--
            Build the HTML document:
            Create a button with an id of "addButton".
        -->
        <div id="output-elements">
            <label for="output">Output:</label>
            <input type="text" id="output" readonly>
        </div>

        <div class="flex">
            <div id="inputs">
                <!--
            Add three input fields and give each field a label.
        -->
                <label for="input1">Input 1:</label>
                <input type="number" id="input1">
                <br>

                <label for="input2">Input 2:</label>
                <input type="number" id="input2">
                <br>
            </div>
            <div id="buttons">
                <button type="button" id="addButton">Add</button>
                <button type="button" id="subtractButton">Subtract</button>
                <button type="button" id="multiplyButton">Multiply</button>
                <button type="button" id="divideButton">Divide</button>
            </div>
        </div>
    </main>

    <script src="/script.js"></script>
    <script src="js/calculate.js"></script>

</body>

</html>
