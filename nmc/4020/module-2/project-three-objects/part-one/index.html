<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Steam Library</title>
    <link href="/style.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="/nmc/4020/css/styles.css" rel="stylesheet">
</head>

<body>
    <main>
        <h1>Explore My Steam Library</h1>
        <section id="library-container">
            <aside id="sort-filter-bar">
                <!-- Sort and Filter my STEAM Library -->
                <label for="sort">Sort by: </label>
                <select name="sort" id="sort"></select>
                <label for="includedGenres">Included Genres</label>
                <select name="includedGenres" id="includedGenres" multiple size="1"></select>
                <label for="excludedGenres">Excluded Genres</label>
                <select name="excludedGenres" id="excludedGenres" multiple size="1"></select>
                <button type="button" id="applyBtn" onclick="sortAndFilter()">Apply</button>
            </aside>
            <div id="games-container"></div>
        </section>
    </main>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/script.js"></script>
    <script src="/script.js"></script>
</body>

</html>
