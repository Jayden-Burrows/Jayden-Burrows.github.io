<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jayden Burrows">
    <title>Exercise: Basic Box Stuff</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link href="/style.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>

    <main>
        <div id="central"></div>
        <label for="image-url" id="url-label">Image url:</label>
        <div id="image-inputs">
            <input type="text" id="image-url" name="image-url"
                placeholder="http://jayden-burrows.me/images/logos/black-logo.png" value="">
            <button id="image-btn" type="button" onclick="changeImage()">Change Image</button>
        </div>
        <br>
        <label id="size-label" for="size-input">Change background-size:</label>
        <div id="size-inputs">
            <input id="size-input" type="range" min="0" max="500">
            <span id="size-output">200%</span>
        </div>
        <label for="background-color" id="background-color-label">Background color:</label>
        <input type="color" id="background-color-input" name="background-color-input" value="#ff69b4">
        <h3>Other Challenges</h3>
        <div class="central ex-1">
        </div>
        <div class="central">
            <img class="ex-2" src="https://nmi.cool/web/wp-content/uploads/sites/3/2025/08/icon.png" alt="NMI Icon">
        </div>
        <div class="central ex-3">
        </div>
        <div class="central ex-4">
        </div>
        <div class="central ex-5">
        </div>
        <div class="central ex-6">
        </div>
        <a href="pwn.college/">This is a link to pwn.college.</a>
    </main>
    <script src="/script.js"></script>
    <script>
        const imageUrl = document.getElementById("image-url");
        const imageBtn = document.getElementById("image-btn");
        const central = document.getElementById("central");
        const sizeInput = document.getElementById("size-input");
        const sizeOutput = document.getElementById("size-output");
        const backgroundColorInput = document.getElementById("background-color-input");

        function setImage() {
            central.style.backgroundImage = `url("${imageUrl.value}")`;
        }

        function setBackgroundImageSize() {
            sizeOutput.textContent = `${sizeInput.value}%`;
            central.style.backgroundSize = `${sizeInput.value}%`;
        }

        function setBackgroundColor() {
            central.style.backgroundColor = `${backgroundColorInput.value}`;
        }

        imageBtn.addEventListener('click', setImage);
        sizeInput.addEventListener('input', setBackgroundImageSize);
        backgroundColorInput.addEventListener('input', setBackgroundColor);
    </script>

</body>

</html>
