<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jayden Burrows">
    <title>Exercise: More HTML</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link href="/style.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
    <header>Form Practice</header>

    <main>
        <h2>Exercise 3: Even more complex form elements</h2>

        <p>Examples of a slider and a color picker.</p>

        <form action="showme.html" method="get">

            <!--
                Step 3: Add a slider.
                Follow the MDN slider example, but create your own
                values and content.
            -->

            <label for="opacity">
                Opacity:
            </label>

            <input type="range" name="opacity" id="opacity" min="0" max="100" step="1" value="1">

            <output class="opacity-output" for="opacity"></output>


            <!--
                Step 4: Add a color picker using the MDN example.
                Then add JavaScript so the selected color produces
                visible feedback.
            -->

            <label for="color-picker1">Color 1:</label>

            <input type="color" name="color1" id="color-picker1" value="#000000">

            <label for="color-picker1">Color 2:</label>

            <input type="color" name="color2" id="color-picker2" value="#000000">

            <div class="color-result"></div>

            <br>
            <br>

            <button type="submit">Submit</button>

        </form>

        <!--
            After pressing the Submit button, note how the form
            inputs affect the URL.
        -->

    </main>

    <!--
        The JavaScript is placed here so the HTML elements it refers
        to already exist when the script runs.
    -->

    <script>
        // Slider feedback
        // Based on the MDN range input example.

        const opacity = document.querySelector("#opacity");
        const opacityOutput = document.querySelector(".opacity-output");

        let opacityValue = opacity.value;

        opacityOutput.textContent = opacityValue;

        opacity.addEventListener("input", () => {
            opacityValue = opacity.value;
            opacityOutput.textContent = opacityValue;
            colorResult.style.opacity = `${opacityValue}%`;
        });

        // Color picker feedback
        // Extends the basic MDN color input example.

        const colorPicker1 = document.querySelector("#color-picker1");
        const colorPicker2 = document.querySelector("#color-picker2");
        const colorResult = document.querySelector(".color-result");

        function updateColorResult() {
            colorResult.style.background = `linear-gradient(to right, ${colorPicker1.value}, ${colorPicker2.value})`
        }

        colorPicker1.addEventListener("input", () => {
            updateColorResult();
        });

        colorPicker2.addEventListener("input", () => {
            updateColorResult();
        });

    </script>

    <script src="/script.js"></script>

</body>

</html>
