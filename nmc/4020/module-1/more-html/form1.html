<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jayden Burrows">
    <title>Exercise: More HTML</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link href="/style.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
    <header>Form Practice</header>
    <main>
        <form action="showme.html" method="get">

            <label for="firstName">First Name:</label>
            <!-- Step 5 -->
            <input type="text" name="firstName" id="firstName">

            <label for="lastName">Last Name:</label>
            <!-- Step 6 -->
            <input type="text" name="lastName" id="lastName">

            <label for="email">Email:</label>
            <!-- Step 7 -->
            <input type="text" name="email" id="email">

            <label for="unpopular-opinion">What is your unpopular opinion?</label>
            <!-- Step 8 -->
            <textarea id="unpopular-opinion" name="unpopular-opinion"></textarea>

            <!-- Step 9: Create labels for each input and textarea. -->

            <!-- Step 10: Add a submit button. -->
            <button type="submit">Submit</button>

        </form>
    </main>
    <script src="/script.js"></script>

</body>

</html>
