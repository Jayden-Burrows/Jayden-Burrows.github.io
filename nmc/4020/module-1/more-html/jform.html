<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jayden Burrows">
    <title>Exercise: More HTML</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link href="/style.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <style>
        #alert-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid black;
            background-color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 100px 0 100px;
            display: none;
        }
    </style>
</head>

<body>

    <header>Form Practice</header>

    <main>

        <h1>Exercise 4: JavaScript and form elements</h1>

        <label for="alert">Message:</label>
        <input type="text" id="alert" name="alert">

        <button type="button" id="clickme">Value</button>

        <div id="alert-box">
            <h3 id="message">Message</h3>
            <button type="button" id="closeBtn">Close</button>
        </div>

    </main>

    <script>
        // Step 1: Tie IDs to variables.

        var formVal = document.querySelector("#alert");
        var whichBut = document.querySelector("#clickme");
        const alertBox = document.getElementById('alert-box');
        const message = document.getElementById('message');
        const closeBtn = document.getElementById('closeBtn');

        // Create the getVal function.

        function getVal() {
            alertBox.style.display = 'flex';
            message.textContent = formVal.value;
        }

        closeBtn.addEventListener('click', () => {
            alertBox.style.display = 'none';
        })

        // Activate getVal whenever whichBut is clicked.

        whichBut.onclick = getVal;
    </script>

    <script src="/script.js"></script>

</body>

</html>
