<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jayden Burrows">
    <title>Exercise: More HTML</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link href="/style.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
    <header>Form Practice</header>

    <main>

        <h2>Exercise 2: More complex form elements</h2>

        <p>
            Examples of a dropdown select box, an autocomplete field, radio buttons, and a number input.
        </p>

        <form action="showme.html" method="get">

            <!--
                Step 3: Create a dropdown select box with at least three items.
                Do not reuse the example below; create your own.
            -->

            <label for="hobbies">Choose your favorite hobby:</label>

            <select name="hobbies" id="hobbies">
                <option value="art">Art</option>
                <option value="music">Music</option>
                <option value="hiking">Hiking</option>
                <option value="swimming">Swimming</option>
                <option value="sports">Sports</option>
            </select>

            <br>

            <!--
                Step 4: Create an autocomplete field based on something
                that interests you. Create your own example.
            -->

            <label for="favoriteYoutubeVideo">
                Input the link to your favorite YouTube video:
            </label>

            <input type="url" name="favoriteYoutubeVideo" id="favoriteYoutubeVideo" autocomplete="url">

            <br>

            <!--
                Step 5: Create a fieldset with at least three radio buttons.
                Create your own values rather than reusing this example.
            -->

            <fieldset>
                <legend>Favorite Dolly Parton Song</legend>

                <div>
                    <input type="radio" id="NineToFive" name="favDollyPartonSong" value="NineToFive" checked>
                    <label for="NineToFive">Nine to Five</label>
                </div>

                <div>
                    <input type="radio" id="Jolene" name="favDollyPartonSong" value="Jolene">
                    <label for="Jolene">Jolene</label>
                </div>

                <div>
                    <input type="radio" id="iWillAlwaysLoveYou" name="favDollyPartonSong" value="iWillAlwaysLoveYou">
                    <label for="iWillAlwaysLoveYou">I will always love you</label>
                </div>
            </fieldset>

            <br>

            <!--
                Step 6: Create a number input.
                Create your own example rather than reusing this one.
            -->

            <label for="numSongs">Number of songs listened to per day (1–20):</label>
            <input type="number" id="numSongs" name="numSongs" min="1" max="20">

            <br>

            <button type="submit">Submit</button>

        </form>

        <!--
            Step 7: Submit the form and examine the URL to see
            how the form data is represented.
        -->

    </main>

    <script src="/script.js"></script>

</body>

</html>
